<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kontrol — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 28px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <button type="button" aria-label="Switch PC. Current: Living-Room PC" style="display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; text-align: left; min-height: 48px">
      <span style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 5px">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Living-Room PC
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
        <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; background: {{chip.bg}}; color: {{chip.fg}}; font-size: 12px; font-weight: 600">
          <span style="{{chip.dot}}"></span>{{chip.label}}
        </span>
      </span>
    </button>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: {{t.text2}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </div>

  <sc-if value="{{reconnecting}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{chip.bg}}; color: {{chip.fg}}; font-size: 14px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
      <span>Reconnecting… controls resume on their own.</span>
    </div>
  </sc-if>
  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.border}}; font-size: 14px">
      <span style="color: {{t.text2}}">PC is offline or asleep.</span>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; font: inherit; font-weight: 600; cursor: pointer">Retry</button>
    </div>
  </sc-if>

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Remotes</h1>
    <span style="font-size: 13px; color: {{t.text3}}">Hold a tile to reorder</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text3}}">Pinned</span>
    <a href="Touchpad.dc.html" style="height: 152px; box-sizing: border-box; border-radius: 22px; background: {{t.accent}}; color: {{t.onAccent}}; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none">
      <span style="display: flex; justify-content: space-between; align-items: flex-start">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M3 15h18M12 15v5"></path></svg>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Pinned" role="img"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Touchpad</span>
        <span style="font-size: 14px; font-weight: 500">Move, click, scroll</span>
      </span>
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Keyboard.dc.html" style="height: 120px; box-sizing: border-box; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.border}}; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: {{t.text}}; text-decoration: none">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{t.accentSoft}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Keyboard</span><span style="font-size: 13px; color: {{t.text2}}">Type and shortcuts</span></span>
      </a>
      <a href="Media.dc.html" style="height: 120px; box-sizing: border-box; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.border}}; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: {{t.text}}; text-decoration: none">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{t.accentSoft}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5v7l6-3.5z"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Media</span><span style="font-size: 13px; color: {{t.text2}}">Play, volume</span></span>
      </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text3}}">All remotes</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Power.dc.html" style="height: 120px; box-sizing: border-box; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.border}}; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: {{t.text}}; text-decoration: none">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{t.accentSoft}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.4 6.6a8 8 0 1 0 11.2 0"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Power</span><span style="font-size: 13px; color: {{t.text2}}">Lock, sleep, shut down</span></span>
      </a>
      <a href="Presentation.dc.html" style="height: 120px; box-sizing: border-box; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.border}}; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; color: {{t.text}}; text-decoration: none">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{t.accentSoft}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M12 16v4M8 20h8M10 8l4 2-4 2z"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Presentation</span><span style="font-size: 13px; color: {{t.text2}}">Slides, laser</span></span>
      </a>
    </div>
    <button type="button" disabled="" style="height: 64px; box-sizing: border-box; border-radius: 20px; background: transparent; border: 1.5px dashed {{t.border}}; padding: 0 16px; display: flex; align-items: center; gap: 12px; color: {{t.text2}}; font: inherit; cursor: not-allowed; text-align: left">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.surface2}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Custom remote</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Coming soon
      </span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["blue","teal"],"default":"blue"},"status":{"editor":"enum","options":["connected","reconnecting","offline"],"default":"connected"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const teal = (this.props.accent ?? 'blue') === 'teal';
    const status = this.props.status ?? 'connected';
    const t = light ? {
      bg: '#F4F5F7', surface: '#FFFFFF', surface2: '#EBEDF1', border: '#DCE0E6', text: '#0E1116', text2: '#4A5260', text3: '#5F6775',
      accent: teal ? '#0B7A70' : '#1F5FD6', onAccent: '#FFFFFF',
      accentSoft: teal ? 'rgba(11,122,112,0.10)' : 'rgba(31,95,214,0.10)', accentText: teal ? '#0B7A70' : '#1F5FD6'
    } : {
      bg: '#0B0C0E', surface: '#15171B', surface2: '#1E2127', border: '#262A31', text: '#F2F4F7', text2: '#A3AAB6', text3: '#8A919E',
      accent: teal ? '#2DD4BF' : '#4C8DFF', onAccent: '#05101F',
      accentSoft: teal ? 'rgba(45,212,191,0.12)' : 'rgba(76,141,255,0.12)', accentText: teal ? '#5EE3D1' : '#8DB6FF'
    };
    const base = 'width:8px;height:8px;border-radius:50%;box-sizing:border-box;';
    const chips = {
      connected: { label: 'Connected', bg: light ? 'rgba(11,122,75,0.10)' : 'rgba(61,220,151,0.12)', fg: light ? '#0B6E44' : '#5BE3A8', dot: base + 'background:' + (light ? '#12A867' : '#3DDC97') },
      reconnecting: { label: 'Reconnecting', bg: light ? 'rgba(180,110,0,0.12)' : 'rgba(245,181,68,0.14)', fg: light ? '#7A4A00' : '#F7C66B', dot: base + 'border:2px solid currentColor;border-right-color:transparent' },
      offline: { label: 'Offline', bg: light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.07)', fg: light ? '#4A5260' : '#A3AAB6', dot: base + 'border:2px solid currentColor' }
    };
    return { t, chip: chips[status] || chips.connected, reconnecting: status === 'reconnecting', offline: status === 'offline' };
  }
}
</script>
</body>
</html>
