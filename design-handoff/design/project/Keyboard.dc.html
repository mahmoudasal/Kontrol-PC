<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kontrol — Keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; color: #F2F4F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 52px 16px 24px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Back to remotes" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #F2F4F7; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 17px; font-weight: 600">Keyboard</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #5BE3A8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC97"></span>Connected · Living-Room PC</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="kb-live" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A919E">Live input</label>
    <textarea id="kb-live" style="height: 104px; box-sizing: border-box; resize: none; border-radius: 16px; border: 1.5px solid #4C8DFF; background: #15171B; color: #F2F4F7; padding: 14px; font: inherit; font-size: 16px; line-height: 1.45; outline: none">Meeting notes — send the deck by Thursday</textarea>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: #8A919E">Each letter goes to the PC as you type.</span>
      <button type="button" style="height: 36px; padding: 0 10px; border-radius: 10px; border: 0; background: none; color: #8DB6FF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Clear</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A919E">Modifiers · tap to hold, double-tap to lock</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 1px solid #4C8DFF; background: #4C8DFF; color: #05101F; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Ctrl</button>
      <button type="button" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Shift</button>
      <button type="button" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Alt</button>
      <button type="button" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Win</button>
    </div>
  </div>

  <div style="display: flex; gap: 12px">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <button type="button" style="height: 46px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Esc</button>
      <button type="button" style="height: 46px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Tab</button>
      <button type="button" style="height: 46px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Del</button>
      <button type="button" style="height: 46px; border-radius: 12px; border: 0; background: #1E2127; color: #F2F4F7; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">Enter
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4"></path></svg>
      </button>
    </div>
    <div role="group" aria-label="Arrow keys" style="width: 156px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, 46px); gap: 6px">
      <span></span>
      <button type="button" aria-label="Up" style="border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
      <span></span>
      <button type="button" aria-label="Left" style="border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
      <button type="button" aria-label="Down" style="border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button>
      <button type="button" aria-label="Right" style="border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>

  <div role="group" aria-label="Function keys" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
    <sc-for list="{{fkeys}}" as="k" hint-placeholder-count="12">
      <button type="button" style="flex: none; width: 52px; height: 44px; border-radius: 12px; border: 1px solid #262A31; background: #15171B; color: #C9CED6; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; cursor: pointer">{{k}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8A919E">Shortcuts</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{shortcuts}}" as="s" hint-placeholder-count="5">
        <button type="button" style="height: 56px; border-radius: 14px; border: 1px solid #262A31; background: #15171B; color: #F2F4F7; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">{{s.label}}</span>
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #8A919E">{{s.keys}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fkeys: ['F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'],
      shortcuts: [
        { label: 'Copy', keys: 'Ctrl C' },
        { label: 'Paste', keys: 'Ctrl V' },
        { label: 'Undo', keys: 'Ctrl Z' },
        { label: 'Switch app', keys: 'Alt Tab' },
        { label: 'Desktop', keys: 'Win D' }
      ]
    };
  }
}
</script>
</body>
</html>
