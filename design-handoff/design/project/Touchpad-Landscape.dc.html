<!doctype html>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #0B0C0E; color: #F2F4F7; font-family: 'Inter', system-ui, sans-serif; display: flex; gap: 10px; padding: 16px 44px 20px 44px; overflow: hidden">

  <div role="application" aria-label="Touchpad surface" style="flex: 1; position: relative; border-radius: 24px; background-color: #121418; background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.4px); background-size: 22px 22px; border: 1px solid #23272E">
    <div style="position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 4px">
      <a href="Main.dc.html" aria-label="Back to remotes" style="width: 44px; height: 44px; border-radius: 14px; background: #1E2127; display: flex; align-items: center; justify-content: center; color: #F2F4F7; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border-radius: 999px; background: rgba(61,220,151,0.12); color: #5BE3A8; font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC97"></span>Connected · Living-Room PC</span>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 300px; top: 150px; width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(76,141,255,0.35); display: flex; align-items: center; justify-content: center">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: rgba(76,141,255,0.35)"></div>
    </div>

    <div aria-label="Scroll strip" style="position: absolute; top: 10px; right: 10px; bottom: 10px; width: 40px; border-radius: 16px; background: #1E2127; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0; box-sizing: border-box; color: #8A919E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </div>
  </div>

  <div style="width: 172px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="flex: 1; border-radius: 20px 20px 10px 10px; border: 1px solid #23272E; background: #15171B; color: #A3AAB6; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer">LEFT</button>
    <button type="button" style="flex: 1; border-radius: 10px 10px 20px 20px; border: 1px solid #23272E; background: #15171B; color: #A3AAB6; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer">RIGHT</button>
    <button type="button" style="height: 56px; border-radius: 18px; border: 0; background: #4C8DFF; color: #05101F; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>Keyboard
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>

  renderVals() { return {}; }

</html>
