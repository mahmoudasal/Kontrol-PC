<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kontrol — Touchpad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 52px 16px 24px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Back to remotes" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: {{t.text}}; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Touchpad</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{chip.fg}}"><span style="{{chip.dot}}"></span>{{chip.label}} · Living-Room PC</span>
    </div>
    <button type="button" aria-label="Touchpad sensitivity" style="width: 48px; height: 48px; border-radius: 14px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: {{t.text2}}; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <div aria-label="Touchpad surface. One finger moves, tap clicks, two fingers scroll." role="application" style="flex: 1; position: relative; border-radius: 24px; background-color: {{t.surface}}; background-image: radial-gradient({{t.dots}} 1px, transparent 1.4px); background-size: 22px 22px; border: 1px solid {{t.border}}">
    <div style="position: absolute; top: 18px; left: 18px; right: 64px; display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{t.surface2}}; color: {{t.text2}}; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">Tap · click</span>
      <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{t.surface2}}; color: {{t.text2}}; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">2-finger tap · right-click</span>
      <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{t.surface2}}; color: {{t.text2}}; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center">Hold · drag</span>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 118px; top: 248px; width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid {{t.ring}}; display: flex; align-items: center; justify-content: center">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: {{t.ring}}"></div>
    </div>

    <div aria-label="Scroll strip" style="position: absolute; top: 10px; right: 10px; bottom: 10px; width: 40px; border-radius: 16px; background: {{t.surface2}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0; box-sizing: border-box; color: {{t.text3}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
        <span style="width: 14px; height: 2px; border-radius: 2px; background: currentColor"></span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </div>

    <button type="button" aria-label="Open keyboard" style="position: absolute; right: 62px; bottom: 16px; width: 56px; height: 56px; border-radius: 18px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: {{t.fabShadow}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 76px; border-radius: 20px 10px 10px 20px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text2}}; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer">LEFT</button>
    <button type="button" style="height: 76px; border-radius: 10px 20px 20px 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text2}}; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer">RIGHT</button>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{t.sheet}}; border-top: 1px solid {{t.border}}; border-radius: 26px 26px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 40px rgba(0,0,0,0.35)">
      <span style="align-self: center; width: 36px; height: 4px; border-radius: 4px; background: {{t.border}}"></span>
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="tp-live" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Text sent live to PC</label>
        <input id="tp-live" value="hello from the couch" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{t.accent}}; background: {{t.surface}}; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px; outline: none">
        <button type="button" aria-label="Close keyboard" style="width: 48px; height: 48px; border-radius: 14px; border: 0; background: {{t.surface2}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="display: flex; gap: 6px; overflow-x: auto">
        <button type="button" style="min-width: 52px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Esc</button>
        <button type="button" style="min-width: 52px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Tab</button>
        <button type="button" aria-pressed="true" style="min-width: 52px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Ctrl</button>
        <button type="button" aria-pressed="false" style="min-width: 52px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Alt</button>
        <button type="button" aria-pressed="false" style="min-width: 52px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Win</button>
        <button type="button" style="min-width: 64px; height: 44px; padding: 0 10px; border-radius: 12px; border: 0; background: {{t.surface2}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Enter</button>
      </div>
      <span style="font-size: 12px; color: {{t.text3}}">Swipe the pad above to keep moving the cursor.</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["blue","teal"],"default":"blue"},"status":{"editor":"enum","options":["connected","reconnecting","offline"],"default":"connected"},"sheet":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const teal = (this.props.accent ?? 'blue') === 'teal';
    const status = this.props.status ?? 'connected';
    const t = light ? {
      bg: '#F4F5F7', surface: '#FFFFFF', surface2: '#EBEDF1', border: '#DCE0E6', text: '#0E1116', text2: '#4A5260', text3: '#5F6775',
      sheet: '#FFFFFF', dots: 'rgba(14,17,22,0.10)',
      accent: teal ? '#0B7A70' : '#1F5FD6', onAccent: '#FFFFFF',
      ring: teal ? 'rgba(11,122,112,0.35)' : 'rgba(31,95,214,0.30)', fabShadow: '0 6px 16px rgba(16,24,40,0.18)'
    } : {
      bg: '#0B0C0E', surface: '#121418', surface2: '#1E2127', border: '#23272E', text: '#F2F4F7', text2: '#A3AAB6', text3: '#8A919E',
      sheet: '#181B20', dots: 'rgba(255,255,255,0.06)',
      accent: teal ? '#2DD4BF' : '#4C8DFF', onAccent: '#05101F',
      ring: teal ? 'rgba(45,212,191,0.35)' : 'rgba(76,141,255,0.35)', fabShadow: '0 8px 24px rgba(0,0,0,0.45)'
    };
    const base = 'width:8px;height:8px;border-radius:50%;box-sizing:border-box;';
    const chips = {
      connected: { label: 'Connected', fg: light ? '#0B6E44' : '#5BE3A8', dot: base + 'background:' + (light ? '#12A867' : '#3DDC97') },
      reconnecting: { label: 'Reconnecting', fg: light ? '#7A4A00' : '#F7C66B', dot: base + 'border:2px solid currentColor;border-right-color:transparent' },
      offline: { label: 'Offline', fg: light ? '#4A5260' : '#A3AAB6', dot: base + 'border:2px solid currentColor' }
    };
    return { t, chip: chips[status] || chips.connected, sheet: !!this.props.sheet };
  }
}
</script>
</body>
</html>
