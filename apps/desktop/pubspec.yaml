name: kontrol_desktop
description: "Kontrol Server: Windows tray app that receives input from the Kontrol phone remote."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  kontrol_protocol:
    path: ../../packages/kontrol_protocol
  kontrol_ui:
    path: ../../packages/kontrol_ui
  lucide_icons_flutter: ^4.0.1
  qr: ^4.0.1
  shared_preferences: ^2.5.6
  window_manager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
